# Cotes du terrain DroneLoad 2027 pour le monde Gazebo.
#
# Source : règlement DroneLoad 2027 V0.1, diffusé par Planète Sciences
# (non versionné dans ce dépôt).
# Chaque valeur porte son origine :
#   [R]  écrite dans le règlement.
#   [F]  lue à l'échelle sur la figure 1 du règlement. La figure est un schéma,
#        pas un plan coté : précision de l'ordre de 20 cm.
#   [H]  hypothèse de simulation, absente du règlement. À confirmer.
#
# Repère terrain : origine au coin du Terrain de jeux côté zone C, à l'opposé
# de l'aire de départ. x le long des 8 m, vers le poste de pilotage.
# y le long des 5 m. z vers le haut. Unités : mètres.
# Sur la figure 1, x va de gauche à droite et y de bas en haut.

voliere:
  longueur: 10.0          # [R] environ 10 m x 6 m, peut changer
  largeur: 6.0            # [R]

terrain:
  longueur: 8.0           # [R] environ 8 m x 5 m, peut changer
  largeur: 5.0            # [R]
  largeur_ruban: 0.05     # [H] largeur de chaque bande de marquage au sol

aire_depart:              # zone A, marquage bleu
  x_min: 6.95             # [F]
  y_min: 2.50             # [F]
  aruco: {id: 0, x: 7.50, y: 3.70}   # id [R], position [F]

zone_depot:               # zone C, séparée de B par la ligne bleue et blanche
  x_max: 3.05             # [F]
  cibles:                 # affiches A3 [R], ordre le long de y [F]
    format: [0.297, 0.420]            # [R] A3, grand côté le long de y [H]
    liste:
      - {numero: 1, x: 0.50, y: 4.35, couleur: [0.27, 0.65, 0.54]}
      - {numero: 3, x: 0.50, y: 3.10, couleur: [0.93, 0.44, 0.34]}
      - {numero: 2, x: 0.50, y: 1.85, couleur: [0.91, 0.30, 0.66]}
      - {numero: 4, x: 0.50, y: 0.60, couleur: [0.49, 0.85, 0.34]}
  # Les images réelles (annexe 3) et les 2 à 4 leurres ne sont pas publiés.
  # Les affiches simulées portent un chiffre sur un fond de couleur.

robot:                    # zone G, robot PULL-E
  x: 2.60                 # [F] axe du rail
  y_min: 0.75             # [F] butées du rail
  y_max: 4.20             # [F]
  y_depart: 2.75          # [F]
  taille: [0.30, 0.30, 0.20]          # [H] encombrement du robot
  aruco_id: 1             # [R] ArUco posé sur le robot
  blocage_visuel:
    x: 2.00               # [F]
    y_min: 0.65           # [F]
    y_max: 4.30           # [F]
    hauteur: 0.50         # [H]
  arucos_alignement:      # ids [R], positions [F], posés à plat [H]
    - {id: 2, x: 1.25, y: 2.55}
    - {id: 3, x: 1.25, y: 1.40}

fenetre:                  # élément E
  x: 5.70                 # [F]
  y: 2.35                 # [F]
  ouverture: 1.00         # [R] 100 x 100 cm
  hauteur_centre: 1.50    # [H] le règlement dit « hauteur aléatoire »
  section_cadre: 0.05     # [H]
  # Recto : face visible du poste de pilotage, sens A vers C. [R]
  # Verso : sens C vers A. [R]

obstacles:                # élément F, colonne à base triangulaire (annexe 6)
  cote: 0.50              # [H] estimé sur la photo de l'annexe 6
  hauteur: 2.00           # [H] estimé sur la photo de l'annexe 6
  liste:
    - {x: 5.50, y: 4.35}  # [F]
    - {x: 3.60, y: 1.20}  # [F] reculé de 20 cm pour tenir les 50 cm du passage sûr

passage_sur:              # élément D
  # Vert à droite du poste de pilotage, jaune à gauche. [R]
  # Aucun obstacle à moins de 50 cm de chaque côté. [R]
  degagement: 0.50        # [R]
  entraxe_lignes: 0.10    # [H]
  axe:                    # [F] de l'aire de départ vers la zone C
    - [7.50, 2.45]
    - [7.50, 1.95]
    - [7.30, 1.30]
    - [6.95, 0.80]
    - [6.35, 0.45]
    - [5.80, 0.35]
    - [5.20, 0.50]
    - [4.75, 0.95]
    - [4.45, 1.65]
    - [4.35, 2.30]
    - [4.35, 3.10]
    - [4.25, 3.75]
    - [3.95, 4.25]
    - [3.60, 4.45]
    - [3.10, 4.45]

aruco:
  dictionnaire: DICT_4X4_50   # [R] dictionnaire 4x4
  cote: 0.20                  # [R] 20 x 20 cm

objet:                    # objet à déposer
  diametre: 0.062         # [R] anneau de 62 mm
  epaisseur: 0.030        # [H]
  masse: 0.050            # [R] 50 g au maximum

drone:
  lacet_deg: 180          # [H] nez vers la zone C au départ
  # Caméra ventrale : Camera Module 3 Wide, à l'avant, pointée vers le sol.
  # [A] = architecture/architecture.md, décidé le 13/11/2026.
  camera:
    # [A] donne 120°, qui est la diagonale. La fiche Raspberry Pi donne
    # 102° en horizontal et 67° en vertical. Gazebo demande l'horizontal.
    champ_horizontal_deg: 102
    largeur_px: 1536      # [H] mode 16:9 du capteur IMX708, résolution de traitement à fixer avec P3
    hauteur_px: 864       # [H]
    cadence_hz: 15        # [H]
    position: [0.10, 0.0, -0.07]   # [H] par rapport au centre du châssis, « à l'avant » selon [A]
    topic: /camera/image
  # Caméra frontale : n'existe pas sur le drone. Question ouverte de [A] §6.
  # Elle sert à évaluer en simulation ce qu'une seconde caméra verrait de la fenêtre E.
  # Mettre active à false pour simuler le drone tel qu'il est décidé.
  camera_avant:
    active: true
    champ_horizontal_deg: 102      # [H] même module que la caméra ventrale
    largeur_px: 1536      # [H]
    hauteur_px: 864       # [H]
    cadence_hz: 15        # [H]
    position: [0.20, 0.0, 0.0]     # [H] devant le châssis, hors du champ des hélices
    topic: /camera_avant/image

vol:                      # seuils proposés dans [A] §3, non validés par l'équipe
  hauteur_largage: 1.20   # [A] proposé
  tolerance_hauteur: 0.15 # [A] proposé
  ecart_max: 0.10         # [A] proposé
  vitesse_max: 0.15       # [A] proposé
  duree_stable: 1.0       # [A] proposé, en secondes
